<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>《留白》交付测试</title>
<style>
  :root{
    --bg:#f7f6f3; --ink:#1c1b19; --sub:#6b6862;
    --line:#ddd9d2; --accent:#8a7f6d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 32px) 22px calc(env(safe-area-inset-bottom) + 32px);
    display:flex;flex-direction:column;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.32em;color:var(--sub);text-transform:uppercase;
  }
  .brand::before{content:"";width:18px;height:1px;background:var(--accent);display:block}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8vh 0}
  .rule{width:44px;height:2px;background:var(--ink);margin-bottom:28px}
  h1{
    margin:0 0 18px;
    font-size:clamp(24px,7.2vw,34px);
    line-height:1.42;
    font-weight:600;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  h1 .thin{display:block;font-weight:300;color:var(--sub);font-size:.62em;letter-spacing:.08em;margin-top:10px}
  .ok{
    display:inline-flex;align-items:center;gap:8px;
    font-size:14px;color:#2f6b4f;
    background:#e8f0ea;border:1px solid #cfe0d6;border-radius:999px;
    padding:7px 14px;margin-bottom:26px;
  }
  .ok .dot{width:6px;height:6px;border-radius:50%;background:#2f6b4f;display:block}
  p.lede{margin:0 0 32px;color:var(--sub);font-size:15px;line-height:1.85;max-width:30em}
  dl{
    margin:0;border-top:1px solid var(--line);
    font-size:13px;line-height:1.5;
  }
  dl > div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
  dt{color:var(--sub);flex:none}
  dd{margin:0;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
  footer{margin-top:28px;font-size:11px;color:#9b978f;letter-spacing:.06em;line-height:1.9}
  .mark{font-size:11px;color:#b3aea5;margin-top:14px}
</style>
</head>
<body>
  <div class="brand">留白 · LIUBAI</div>

  <main>
    <div class="rule"></div>
    <div class="ok"><span class="dot"></span>文件交付链路验证</div>
    <h1>
      《留白》交付测试成功
      <span class="thin">Delivery Test Passed</span>
    </h1>
    <p class="lede">如果你在安卓手机上看到了这一页，说明 ZIP 文件已经真实到达你的设备，并且本地解压与打开都正常。</p>

    <dl>
      <div><dt>文件名</dt><dd>delivery-test.html</dd></div>
      <div><dt>打包于</dt><dd id="built">2026-10-17 19:40 (+08:00)</dd></div>
      <div><dt>视口宽度</dt><dd id="vw">—</dd></div>
      <div><dt>打开时间</dt><dd id="now">—</dd></div>
    </dl>

    <div class="mark">— 此页为静态单文件，无外部依赖</div>
  </main>

  <footer>
    留白 · 长期虚拟世界项目<br>
    第二轮验收 · 手机端文件交付测试
  </footer>

<script>
  (function () {
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var fmt = function (d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    };
    document.getElementById('now').textContent = fmt(new Date());
    document.getElementById('vw').textContent = window.innerWidth + ' px';
  })();
</script>
</body>
</html>
