<!DOCTYPE html>
<!--
  比奇堡 · 抓水母大作战
  SpongeBob rides Patrick on a coral-red bicycle through Bikini Bottom, scooping jellyfish.
  A tribute to the "pelican riding a bicycle" benchmark — pure inline SVG + vanilla JS,
  no fonts, images or CDN required. Open this file in any modern browser.

  Controls: click the scene or press S to swing the net · Space to pause · speed button
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海绵宝宝骑派大星 · 比奇堡抓水母</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    --pad:clamp(10px,2vw,28px);
    background:
      radial-gradient(1100px 700px at 50% -10%, #12556f 0%, #072534 55%, #03141d 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:var(--pad);
    font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#eafcff;overflow-x:hidden;
  }
  .stage{
    position:relative;width:min(1200px,100%,calc((100vh - 2*var(--pad)) * 16 / 9));aspect-ratio:16/9;
    border-radius:26px;overflow:hidden;background:#0a4a63;cursor:pointer;
    box-shadow:
      0 34px 90px -22px rgba(0,0,0,.85),
      0 0 0 1px rgba(150,235,255,.20),
      0 0 70px -10px rgba(40,190,230,.28);
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  svg{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none;padding:clamp(9px,1.7vw,20px);
       display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card{
    background:rgba(4,32,45,.46);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    border:1px solid rgba(175,240,255,.26);
    border-radius:16px;padding:9px 14px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.12);
  }
  h1{margin:0;font-size:clamp(13px,1.55vw,21px);letter-spacing:.6px;line-height:1.15;
     text-shadow:0 2px 0 rgba(0,60,80,.6)}
  .sub{margin:3px 0 0;font-size:clamp(9px,.95vw,12px);opacity:.72;letter-spacing:.4px}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .right-bottom{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  .score{display:flex;align-items:center;gap:8px;font-size:clamp(12px,1.4vw,19px);font-weight:700;white-space:nowrap}
  .score b{font-size:clamp(16px,2vw,27px);min-width:1.2em;text-align:right;
           display:inline-block;transition:transform .18s ease, color .18s ease}
  .score b.pop{transform:scale(1.55);color:#ffe27a}
  .score .unit{font-size:.66em;opacity:.8;font-weight:400}
  .row{display:flex;gap:7px;pointer-events:auto}
  .btn{
    pointer-events:auto;cursor:pointer;font-family:inherit;font-size:clamp(10px,1vw,13px);
    color:#eafcff;background:rgba(9,58,78,.72);border:1px solid rgba(160,235,255,.35);
    border-radius:999px;padding:7px 13px;font-weight:600;letter-spacing:.5px;
    transition:background .15s ease, transform .1s ease, border-color .15s;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .btn:hover{background:rgba(24,105,135,.85);border-color:rgba(190,245,255,.7)}
  #btnSwing{background:rgba(255,203,92,.92);color:#5a3200;border-color:rgba(255,235,170,.9);
    box-shadow:0 4px 14px -4px rgba(255,180,40,.7), inset 0 -2px 0 rgba(160,100,0,.22)}
  #btnSwing:hover{background:rgba(255,220,130,1);border-color:#fff}
  .btn:active{transform:scale(.94)}
  .hint{
    align-self:flex-start;font-size:clamp(9px,.95vw,12px);opacity:.8;letter-spacing:.5px;
    padding:5px 12px;border-radius:999px;background:rgba(4,32,45,.42);
    border:1px solid rgba(175,240,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .credit{font-size:clamp(8px,.85vw,11px);letter-spacing:.6px;text-align:right;line-height:1.5;
    background:rgba(4,32,45,.38);border:1px solid rgba(175,240,255,.12);border-radius:999px;
    padding:4px 11px;opacity:.62;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .toast{
    position:absolute;left:50%;top:19%;transform:translate(-50%,-14px) scale(.9);
    background:rgba(255,240,150,.94);color:#7a4300;font-weight:800;
    padding:9px 20px;border-radius:999px;font-size:clamp(12px,1.3vw,17px);
    letter-spacing:1px;opacity:0;pointer-events:none;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.7), inset 0 -2px 0 rgba(180,110,0,.25);
    transition:opacity .22s ease, transform .28s cubic-bezier(.2,1.6,.4,1);
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
  body.clean{padding:0;background:#04141e;display:block;overflow:hidden}
  body.clean .stage{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none}
  body.clean .hint, body.clean .credit, body.clean .row{display:none}
  .rotate-tip{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    display:none;white-space:nowrap;font-size:11px;letter-spacing:.5px;
    color:#dff9ff;background:rgba(4,32,45,.55);border:1px solid rgba(175,240,255,.2);
    padding:5px 12px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  @media (max-width:900px){
    .credit{display:none}
  }
  @media (max-width:640px){
    .hint{display:none}
  }
  @media (max-width:640px) and (orientation:portrait){
    .rotate-tip{display:block}
  }
</style>
</head>
<body>

  /* ---------- 背景滚动 ---------- */
  const farScroll = $('farScroll'), midScroll = $('midScroll'), groundScroll = $('groundScroll');
  const rig = $('rig'), bodyG = $('bodyG'), net = $('net');
  const legNear = $('legNear'), legFar = $('legFar');

  /* ---------- 两段式 IK（膝盖朝前） ---------- */
  function ik(h, f, l1, l2, forward) {
    let dx = f.x - h.x, dy = f.y - h.y;
    let d = Math.hypot(dx, dy);
    d = Math.max(0.001, Math.min(d, l1 + l2 - 1));
    const ux = dx / Math.hypot(dx, dy || 1), uy = dy / Math.hypot(dx, dy || 1);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const hh = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = h.x + ux * a, my = h.y + uy * a;
    const k1 = { x: mx - uy * hh, y: my + ux * hh };
    const k2 = { x: mx + uy * hh, y: my - ux * hh };
    if (forward === false) return k1.x <= k2.x ? k1 : k2;   // 前肢：肘朝后
    return k1.x >= k2.x ? k1 : k2;                            // 后肢：膝朝前
  }
  function setLimb(g, h, f, l1, l2, forward) {
    if (!g) return;
    const k = ik(h, f, l1, l2, forward);
    const pts = h.x.toFixed(1) + ',' + h.y.toFixed(1) + ' ' + k.x.toFixed(1) + ',' + k.y.toFixed(1) + ' ' + f.x.toFixed(1) + ',' + f.y.toFixed(1);
    g.querySelectorAll('polyline').forEach(p => p.setAttribute('points', pts));
  }
  function setFE(el, pt) {
    if (!el) return;
    el.setAttribute('cx', pt.x.toFixed(1));
    el.setAttribute('cy', pt.y.toFixed(1));
  }

  /* ---------- 气泡 ---------- */
  const bubblesG = $('bubbles'), bubblesFront = $('bubblesFront');
  const bubbles = [];
  for (let i = 0; i < 26; i++) {
    const b = {
      x: rand(0, 1200), y: rand(0, 675), r: rand(2.2, 7.5),
      vy: rand(16, 44), ph: rand(0, 6.28), front: i % 5 === 0,
      el: document.createElementNS(NS, 'circle')
    };
    b.r = b.front ? b.r * 1.9 : b.r;
    b.el.setAttribute('r', b.r.toFixed(1));
    (b.front ? bubblesFront : bubblesG).appendChild(b.el);
    bubbles.push(b);
  }

  /* ---------- 水母 ---------- */
  const jelliesG = $('jellies');
  const jellies = [];
  let uid = 0;

  function makeJellyEl() {
    const g = document.createElementNS(NS, 'g');
    g.innerHTML =
      '<ellipse cx="0" cy="4" rx="54" ry="46" fill="url(#jellyAura)"/>' +
      '<g stroke="#ff9ad8" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".92">' +
        '<path class="tent" data-ox="-24" data-oy="10" d="M -24,10 C -30,28 -36,44 -26,60"/>' +
        '<path class="tent" data-ox="-8"  data-oy="12" d="M -8,12 C -12,32 -16,50 -6,66"/>' +
        '<path class="tent" data-ox="8"   data-oy="12" d="M 8,12 C 12,32 16,50 6,66"/>' +
        '<path class="tent" data-ox="24"  data-oy="10" d="M 24,10 C 30,28 36,44 26,60"/>' +
      '</g>' +
      '<path d="M -44,12 C -44,-14 -26,-36 0,-36 C 26,-36 44,-14 44,12 C 34,20 26,6 16,14 C 8,20 0,8 -8,14 C -18,20 -30,8 -44,12 Z" fill="url(#jellyBell)" stroke="#ff6fc4" stroke-width="3"/>' +
      '<path d="M -30,-8 C -27,-24 -14,-31 1,-30" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55"/>' +
      '<circle cx="-12" cy="-4" r="3.4" fill="#8a2a60"/><circle cx="9" cy="-7" r="3.4" fill="#8a2a60"/>' +
      '<ellipse cx="0" cy="8" rx="15" ry="5" fill="#ffd0ec" opacity=".6"/>';
    return g;
  }

  function makeJelly(x, y, s, vx) {
    const el = makeJellyEl();
    const j = {
      id: ++uid, x, y, s, vx, ph: rand(0, 6.28),
      state: 'free', ct: 0, el,
      tents: [...el.querySelectorAll('.tent')]
    };
    el.dataset.id = j.id;
    jelliesG.appendChild(el);
    jellies.push(j);
    return j;
  }

  // 初始水母：一部分在普通水域，一部分在网口附近
  [[330, 210, .62], [560, 158, .75], [770, 300, .55], [1010, 150, .9], [1140, 262, .8], [930, 118, .65]]
    .forEach(([x, y, s], i) => makeJelly(x, y, s, -rand(22, 38)));

  const pendingSpawn = [];
  function spawnAhead() {
    makeJelly(rand(1220, 1380), rand(120, 320), rand(0.55, 0.95), -rand(26, 48));
  }

  /* ---------- 特效 ---------- */
  const sparksG = $('sparks'), puffsG = $('puffs');
  const sparks = [];
  function sparkle(x, y) {
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', 10);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', '#fff3b0'); ring.setAttribute('stroke-width', '3');
    sparksG.appendChild(ring);
    sparks.push({ el: ring, life: .55, max: .55, kind: 'ring', x, y });

    for (let i = 0; i < 10; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 200);
      const c = document.createElementNS(NS, 'circle');
      const r = rand(1.6, 4);
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
      c.setAttribute('fill', i % 3 === 0 ? '#fff' : (i % 3 === 1 ? '#ffe27a' : '#ffb3e6'));
      sparksG.appendChild(c);
      sparks.push({ el: c, life: .7, max: .7, kind: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 });
    }
  }

  const puffs = [];
  function puff(x, y) {
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', x); e.setAttribute('cy', y);
    e.setAttribute('rx', rand(5, 10)); e.setAttribute('ry', rand(3, 6));
    e.setAttribute('fill', '#f3e2b0');
    puffsG.appendChild(e);
    puffs.push({ el: e, life: .55, max: .55, x, y, vx: rand(-80, -30), vy: rand(-26, -62), g: 26 });
  }

  /* ---------- 速度线 ---------- */
  const streaksG = $('streaks');
  const streaks = [];
  for (let i = 0; i < 7; i++) {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('stroke-width', rand(2, 3.6).toFixed(1));
    streaksG.appendChild(l);
    streaks.push({ el: l, y: 452 + i * 20 + rand(-10, 10), off: rand(0, 320), len: rand(26, 78), sp: rand(240, 360), op: rand(.07, .18) });
  }

  /* ---------- 捕获逻辑 ---------- */
  const scoreEl = $('score'), toastEl = $('toast');
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
  }
  function bumpScore() {
    state.score++;
    scoreEl.textContent = state.score;
    scoreEl.classList.add('pop');
    setTimeout(() => scoreEl.classList.remove('pop'), 220);
  }

  function startCatch(j) {
    if (!j || j.state !== 'free') return;
    j.state = 'catching';
    j.ct = 0;
    state.swipe = .5;
    state.cd = 2.6;
  }
  function finishCatch(j) {
    j.el.remove();
    const idx = jellies.indexOf(j);
    if (idx >= 0) jellies.splice(idx, 1);
    bumpScore();
    sparkle(state.mouth.x, state.mouth.y);
    toast('捕获 +1  🪼');
    pendingSpawn.push(state.t + .9);
  }

  function swing() {
    if (state.paused) return;
    state.swipe = .5;
    state.cd = 2.4;
    const cand = jellies
      .filter(j => j.state === 'free' && Math.hypot(j.x - state.mouth.x, j.y - state.mouth.y) < 340)
      .sort((a, b) => Math.hypot(a.x - state.mouth.x, a.y - state.mouth.y) - Math.hypot(b.x - state.mouth.x, b.y - state.mouth.y));
    if (cand.length) startCatch(cand[0]);
    else toast('再靠近一点点～');
  }

  /* ---------- 主循环 ---------- */
  let last = performance.now();

  function update(dt) {
    const t = state.t;

    /* 场景滚动 */
    state.far = (state.far + 22 * dt) % 1600;
    state.mid = (state.mid + 56 * dt) % 1600;
    state.ground = (state.ground + 150 * dt) % 1600;
    setT(farScroll, 'translate(' + (-state.far).toFixed(2) + ',0)');
    setT(midScroll, 'translate(' + (-state.mid).toFixed(2) + ',0)');
    setT(groundScroll, 'translate(' + (-state.ground).toFixed(2) + ',0)');

    /* ---------- 派大星小跑 ---------- */
    const p = t * 9.5;                                  // 步态相位
    const bob = -1 - 5 * Math.abs(Math.sin(p));         // 身体起伏
    state.bob = bob;
    setT(bodyG, 'translate(0,' + bob.toFixed(2) + ')');

    const step = (b, ph, stride, lift) => ({
      x: b.x + Math.cos(ph) * stride,
      y: b.y - Math.max(0, Math.sin(ph)) * lift
    });
    const fN = step(G.footNearBase, p, 26, 24);
    const fF = step(G.footFarBase, p + Math.PI, 26, 24);
    const hN = step(G.handNearBase, p + Math.PI, 20, 7);
    const hF = step(G.handFarBase, p, 20, 7);

    const hiNear = { x: G.hipNear.x, y: G.hipNear.y + bob };
    const hiFar  = { x: G.hipFar.x,  y: G.hipFar.y + bob };
    const shNear = { x: G.shoulderNear.x, y: G.shoulderNear.y + bob };
    const shFar  = { x: G.shoulderFar.x,  y: G.shoulderFar.y + bob };

    setLimb(legFar,  hiFar,  fF, 62, 60, true);
    setFE(footFar, fF);
    setLimb(armFar,  shFar,  hF, 56, 52, false);
    setFE(handFar, hF);
    setLimb(legNear, hiNear, fN, 62, 60, true);
    setFE(footNear, fN);
    setLimb(armNear, shNear, hN, 56, 52, false);
    setFE(handNear, hN);

    /* 头部随步频轻点 */
    setT(patrickHead, 'translate(-31,2) rotate(' + (Math.sin(p + .6) * 2.6).toFixed(2) + ' 843 340)');
    /* 海绵宝宝被颠得一颠一颠 */
    setT($('sb'), 'translate(0,' + (-1.8 * Math.sin(2 * p + .9)).toFixed(2) + ')');
    setT($('sbLegNear'), 'rotate(' + (Math.sin(2 * p + .4) * 3.2).toFixed(2) + ' 742 430)');

    state.feet = { rNear: fN, rFar: fF };

    /* ---------- 网 ---------- */
    if (state.swipe > 0) state.swipe = Math.max(0, state.swipe - dt);
    const sp = 1 - state.swipe / .5;
    const swipeAng = state.swipe > 0 ? -15 * Math.sin(Math.PI * Math.min(1, sp)) : 0;
    const deg = -3 + Math.sin(t * 1.15) * 3 + swipeAng;
    setT(net, 'translate(17,15) rotate(' + deg.toFixed(2) + ' 734 263)');

    const dx = G.hoop.x - G.hand.x, dy = G.hoop.y - G.hand.y;
    const rr = deg * Math.PI / 180, cc = Math.cos(rr), ss = Math.sin(rr);
    state.mouth.x = G.hand.x + dx * cc - dy * ss;
    state.mouth.y = bob + G.hand.y + dx * ss + dy * cc;

    /* 水母 */
    for (let i = jellies.length - 1; i >= 0; i--) {
      const j = jellies[i];
      if (j.state === 'free') {
        j.x += j.vx * dt;
        j.y += Math.sin(t * .85 + j.ph) * 9 * dt;
        if (j.x < -120) {
          j.x = rand(1240, 1420);
          j.y = rand(110, 340);
          j.vx = -rand(24, 46);
          j.s = rand(.55, .95);
        }
      } else if (j.state === 'catching') {
        j.ct += dt;
        const k = Math.min(1, dt * 11);
        j.x += (state.mouth.x - 6 - j.x) * k;
        j.y += (state.mouth.y + 8 - j.y) * k;
        j.s += (0.28 - j.s) * Math.min(1, dt * 6);
        if (j.ct > .55) { finishCatch(j); continue; }
      }
      const bobJ = Math.sin(t * 1.7 + j.ph) * 8;
      const sq = Math.sin(t * 3.1 + j.ph) * .05;
      setT(j.el, 'translate(' + j.x.toFixed(1) + ',' + (j.y + bobJ).toFixed(1) + ') scale(' + ((1 + sq) * j.s).toFixed(3) + ',' + ((1 - sq) * j.s).toFixed(3) + ')');
      for (let k = 0; k < j.tents.length; k++) {
        const tn = j.tents[k];
        const ang = Math.sin(t * 2.3 + j.ph + k * .8) * 13;
        setT(tn, 'rotate(' + ang.toFixed(1) + ' ' + tn.dataset.ox + ' ' + tn.dataset.oy + ')');
      }
    }

    /* 自动补一只 */
    for (let i = pendingSpawn.length - 1; i >= 0; i--) {
      if (state.t >= pendingSpawn[i]) { pendingSpawn.splice(i, 1); spawnAhead(); }
    }

    /* 自动捕捞 */
    if (state.cd > 0) state.cd -= dt;
    else {
      let best = null, bd = 1e9;
      for (const j of jellies) {
        if (j.state !== 'free') continue;
        const d = Math.hypot(j.x - state.mouth.x, j.y - state.mouth.y);
        if (d < bd) { bd = d; best = j; }
      }
      if (best && bd < 122) startCatch(best);
    }

    /* 气泡 */
    for (const b of bubbles) {
      b.y -= b.vy * dt * (b.front ? .7 : 1);
      b.x += Math.sin(t * 1.6 + b.ph) * 10 * dt;
      if (b.y < -30) { b.y = 700; b.x = rand(0, 1200); }
      b.el.setAttribute('cx', b.x.toFixed(1));
      b.el.setAttribute('cy', b.y.toFixed(1));
    }

    /* 沙尘 */
    if (dt > 0) {
      puffTimer -= dt;
      if (puffTimer <= 0) {
        puffTimer = .07;
        const ft = Math.random() < .5 ? state.feet.rNear : state.feet.rFar;
        puff(ft.x - 4 + rand(-8, 6), ft.y + rand(1, 6));
      }
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
      if (p.life <= 0) { p.el.remove(); puffs.splice(i, 1); continue; }
      const k = p.life / p.max;
      p.el.setAttribute('cx', p.x.toFixed(1));
      p.el.setAttribute('cy', p.y.toFixed(1));
      p.el.setAttribute('opacity', (k * .55).toFixed(2));
    }

    /* 火花 */
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= dt;
      if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); continue; }
      const k = s.life / s.max;
      if (s.kind === 'ring') {
        s.el.setAttribute('r', (10 + (1 - k) * 52).toFixed(1));
        s.el.setAttribute('opacity', (k * .9).toFixed(2));
      } else {
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 240 * dt;
        s.el.setAttribute('cx', s.x.toFixed(1));
        s.el.setAttribute('cy', s.y.toFixed(1));
        s.el.setAttribute('opacity', k.toFixed(2));
      }
    }

    /* 速度线 */
    for (const s of streaks) {
      const x = 620 - ((s.off + t * s.sp) % 420);
      s.el.setAttribute('x1', (x + s.len).toFixed(1));
      s.el.setAttribute('y1', s.y.toFixed(1));
      s.el.setAttribute('x2', x.toFixed(1));
      s.el.setAttribute('y2', s.y.toFixed(1));
      const edge = Math.min(1, Math.max(0, (x - 150) / 120), Math.max(0, (620 - x) / 120));
      s.el.setAttribute('opacity', (s.op * edge * .8).toFixed(2));
    }

    /* 光柱呼吸 */
    for (let i = 0; i < 5; i++) {
      const el = $('ray' + i);
      if (!el) continue;
      const base = [.085, .06, .075, .045, .035][i];
      el.setAttribute('opacity', (base * (0.72 + 0.45 * Math.sin(t * .7 + i * 1.3))).toFixed(3));
    }

    /* 沙面光斑 */
    for (let i = 0; i < 3; i++) {
      const el = $('cau' + i);
      if (!el) continue;
      el.setAttribute('opacity', (0.05 + 0.06 * (0.5 + 0.5 * Math.sin(t * .9 + i * 2.1))).toFixed(3));
    }

    /* 前景海草 */
    const sway = (m, s) => (Math.sin(t * 1.1 * s + m) * 3.2).toFixed(2);
    setT($('kelpL'), 'rotate(' + sway(0, 1) + ' 40 690)');
    setT($('kelpL2'), 'rotate(' + sway(1.4, 1.3) + ' 92 690)');
    setT($('kelpR'), 'rotate(' + sway(2.2, .9) + ' 1168 690)');
    setT($('kelpR2'), 'rotate(' + sway(.7, 1.15) + ' 1116 690)');
  }

  let puffTimer = 0;

  function frame(now) {
    let raw = (now - last) / 1000;
    last = now;
    if (!isFinite(raw) || raw < 0) raw = 0;
    raw = Math.min(raw, .05);
    const dt = state.paused ? 0 : raw * state.speeds[state.speedIdx];
    state.t += dt;
    update(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 交互 ---------- */
  const stage = $('stage');
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.btn')) return;
    swing();
  });
  stage.addEventListener('keydown', e => e.stopPropagation());

  $('btnSwing').addEventListener('click', e => { e.stopPropagation(); swing(); });

  const btnPause = $('btnPause');
  btnPause.addEventListener('click', e => {
    e.stopPropagation();
    state.paused = !state.paused;
    btnPause.textContent = state.paused ? '▶ 继续' : '⏸ 暂停';
  });

  const labels = ['1.0×', '1.75×', '0.55×'];
  const btnSpeed = $('btnSpeed');
  btnSpeed.addEventListener('click', e => {
    e.stopPropagation();
    state.speedIdx = (state.speedIdx + 1) % 3;
    btnSpeed.textContent = labels[state.speedIdx];
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); btnPause.click(); }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); swing(); }
  });

  /* 调试钩子（截图/测试用） */
  window.__SCENE = { state, jellies, swing };
  if (location.search.indexOf('clean') >= 0) document.body.classList.add('clean');
})();
</script>
</body>
</html>
